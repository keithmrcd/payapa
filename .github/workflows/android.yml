# Builds the Android app on every push to main (or by hand from the Actions tab):
#   payapa-debug-apk    debug build, for testing
#   payapa-release-apk  signed release build, to install and keep (only when the signing secrets exist)
# Download them from the run's "Artifacts" section and install on the phone.
#
# Repository settings (Settings -> Secrets and variables -> Actions):
#   variables  VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY   (public by design; without them sync is off)
#   secrets    PAYAPA_KEYSTORE_BASE64 (base64 of the .p12), PAYAPA_STORE_PASSWORD, PAYAPA_KEY_PASSWORD
# The keystore itself lives outside the repo; never commit it.
name: Android APK
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: payapa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode the release keystore
        id: key
        env: { KEYSTORE: '${{ secrets.PAYAPA_KEYSTORE_BASE64 }}' }
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No signing secrets; skipping the release build."; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/payapa-release.p12"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Check the keystore opens
        if: steps.key.outputs.ready == 'true'
        env: { STORE_PASSWORD: '${{ secrets.PAYAPA_STORE_PASSWORD }}' }
        run: keytool -list -keystore "$RUNNER_TEMP/payapa-release.p12" -storetype PKCS12 -storepass:env STORE_PASSWORD | grep -i "entry"
      - name: Build the signed release APK
        if: steps.key.outputs.ready == 'true'
        env:
          PAYAPA_STORE_FILE: ${{ runner.temp }}/payapa-release.p12
          PAYAPA_STORE_PASSWORD: ${{ secrets.PAYAPA_STORE_PASSWORD }}
          PAYAPA_KEY_ALIAS: payapa
          PAYAPA_KEY_PASSWORD: ${{ secrets.PAYAPA_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease
      - name: Verify the release signature
        if: steps.key.outputs.ready == 'true'
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk 2>&1 | grep -v -i "^WARNING"
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ready == 'true'
        with:
          name: payapa-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/payapa-release.p12"
