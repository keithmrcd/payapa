# Builds the Android app on every push to main (or by hand from the Actions tab):
#   payapa-debug-apk    debug build, for testing
#   payapa-release-apk  signed release build, to install and keep (only when the signing secrets exist)
# Download them from the run's "Artifacts" section and install on the phone.
#
# Repository settings (Settings -> Secrets and variables -> Actions):
#   variables  VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY   (public by design; without them sync is off)
#   secrets    PAYAPA_KEYSTORE_BASE64 (base64 of the .p12), PAYAPA_STORE_PASSWORD, PAYAPA_KEY_PASSWORD
# The keystore itself lives outside the repo; never commit it.
name: Android APK
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: payapa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Decode the release keystore
        id: key
        env: { KEYSTORE: '${{ secrets.PAYAPA_KEYSTORE_BASE64 }}' }
        run: |
          if [ -z "$KEYSTORE" ]; then echo "No signing secrets; skipping the release build."; exit 0; fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/payapa-release.p12"
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Check the keystore opens (prints no secrets)
        if: steps.key.outputs.ready == 'true'
        env: { STORE_PASSWORD: '${{ secrets.PAYAPA_STORE_PASSWORD }}' }
        run: |
          echo "password length: ${#STORE_PASSWORD}"
          echo "keystore sha256: $(sha256sum "$RUNNER_TEMP/payapa-release.p12" | cut -c1-16)"
          keytool -list -keystore "$RUNNER_TEMP/payapa-release.p12" -storetype PKCS12 -storepass:env STORE_PASSWORD 2>&1 | grep -v -i "warning" || true
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/payapa-release.p12" -passin env:STORE_PASSWORD -noout && echo "openssl: opens" || echo "openssl: does not open"
          # Temporary: which PKCS12 encryption does this Java read? (same key, same password; files removed below)
          T="$RUNNER_TEMP/k"; mkdir -p "$T"
          openssl pkcs12 -legacy -in "$RUNNER_TEMP/payapa-release.p12" -passin env:STORE_PASSWORD -nodes -out "$T/all.pem" 2>/dev/null
          openssl pkcs12 -export -in "$T/all.pem" -name payapa -out "$T/aes.p12" -passout env:STORE_PASSWORD
          openssl pkcs12 -export -legacy -in "$T/all.pem" -name payapa -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -out "$T/3des.p12" -passout env:STORE_PASSWORD
          for f in aes 3des; do echo "== $f"; keytool -list -keystore "$T/$f.p12" -storetype PKCS12 -storepass:env STORE_PASSWORD 2>&1 | grep -v -i warning | head -3; done
          echo "== keytool-made, same password"; keytool -genkeypair -keystore "$T/kt.p12" -storetype PKCS12 -storepass:env STORE_PASSWORD -alias t -keyalg RSA -keysize 2048 -dname CN=t -validity 1 2>&1 | grep -v -i warning | head -2; keytool -list -keystore "$T/kt.p12" -storepass:env STORE_PASSWORD 2>&1 | grep -i -E "entr|error" | head -2
          echo "== openssl-made, simple password"; openssl req -x509 -newkey rsa:2048 -nodes -keyout "$T/t.key" -out "$T/t.crt" -days 1 -subj /CN=t 2>/dev/null; openssl pkcs12 -export -inkey "$T/t.key" -in "$T/t.crt" -name t -out "$T/simple.p12" -passout pass:simple123; keytool -list -keystore "$T/simple.p12" -storepass simple123 2>&1 | grep -i -E "entr|error" | head -2
          echo "== password chars: $(printf '%s' "$STORE_PASSWORD" | tr -d 'A-Za-z0-9' | wc -c) non-alphanumeric"
          echo "== apksigner: $(ls $ANDROID_HOME/build-tools/ | tail -1)"
          rm -rf "$T"
      - name: Build the signed release APK
        if: steps.key.outputs.ready == 'true'
        env:
          PAYAPA_STORE_FILE: ${{ runner.temp }}/payapa-release.p12
          PAYAPA_STORE_PASSWORD: ${{ secrets.PAYAPA_STORE_PASSWORD }}
          PAYAPA_KEY_ALIAS: payapa
          PAYAPA_KEY_PASSWORD: ${{ secrets.PAYAPA_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ready == 'true'
        with:
          name: payapa-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/payapa-release.p12"
