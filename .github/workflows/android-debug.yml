# Builds a debug APK on every push to main (or by hand from the Actions tab).
# Download it from the run's "Artifacts" section and install it on your phone.
name: Android debug APK
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: payapa-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
